spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true

  datasource:
    url: jdbc:h2:mem:maindb

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,logfile
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/hw16.log
